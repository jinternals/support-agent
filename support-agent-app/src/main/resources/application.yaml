spring:
  threads:
    virtual:
      enabled: true
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
      client:
        observations:
          log-prompt: true
          log-completion: true
    #    ollama:
    #      base-url: http://localhost:11434
    #      init:
    #        pull-model-strategy: when_missing
    #        timeout: 10m
    #        max-retries: 2
    #      embedding:
    #        model: dengcao/Qwen3-Embedding-8B:Q8_0
    #      chat:
    #        model: qwen3:8b
    #        options:
    #          temperature: 0.1
    openai:
      api-key: "na"
      base-url: "http://localhost:12434/engines"
      chat:
        options:
          model: ai/qwen3:8B-Q4_K_M
      embedding:
        options:
          model: ai/mxbai-embed-large:latest
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: support
        use-tls: false
        initialize-schema: true
    mcp:
      client:
        streamable-http:
          connections:
            support-mcp-server:
              url: http://localhost:8081

  datasource:
    url: jdbc:postgresql://localhost:5432/assistant
    username: assistant
    password: assistant

# Actuator and Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: support-agent

# Agent Configuration
agent:
  reflection:
    enabled: true
    threshold: 7.0

logging.level.org.springframework.ai: DEBUG
logging.level.io.modelcontextprotocol: DEBUG
