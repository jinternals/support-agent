server:
  port: 8081
spring:
  ai:
    mcp:
      server:
        name: support-mcp-server
        protocol: stateless
        version: 1.0.0
        type: SYNC
        instructions: "This server provides support ticket creation tools and resources"

# Actuator and Metrics
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus,mcp
  metrics:
    tags:
      application: support-mcp
  tracing:
    sampling:
      probability: 1.0

# Agent Configuration
agent:
  reflection:
    enabled: true
    threshold: 7.0

logging.level.org.springframework.ai: DEBUG
logging.level.io.modelcontextprotocol: DEBUG
